# FAFB real-data pilot — normalized 3D Gaussian volume reconstruction
# Version: v18
#
# Reconstruction:
#
#              Σ_i w_i(x) f_i
#   V(x) = -----------------------
#              Σ_i w_i(x) + ε
#
# Loss:
#
#   L = 0.7 L1 + 0.3 (1 - SSIM)
#
# No additional loss regularizers are used.
#
# Example:
#
# python scripts/train.py \
#     --config configs/fafb_v18.toml \
#     data/fafb/blocks/image_z32_y31_x31.tif \
#     --output outputs/fafb_v18/b_211 \
#     --save-volume outputs/fafb_v18/b_211/reconstruction.tif


# ── Experiment ─────────────────────────────────────────────────────────────────

[experiment]

name = "fafb_real_data_pilot"
version = 18
description = "Normalized Gaussian reconstruction with L1 and 3D SSIM"
seed = 42


# ── Input ──────────────────────────────────────────────────────────────────────

[input]

# Can be overridden with --input.
path = "data/fafb/blocks/image_z32_y31_x31.tif"

# Used for container formats such as HDF5 and NPZ.
dataset = "image"

# Normalize the input volume to [0,1].
normalize = true

# Optional fixed normalization range.
# normalization_minimum = 0.0
# normalization_maximum = 255.0


# ── Runtime ────────────────────────────────────────────────────────────────────

[runtime]

device = "cuda"

# Use the native JIT-compiled CUDA implementation.
use_kernel = true
verbose_cuda_build = false

no_wandb = true
flat_out = true

# FAFB blocks do not use SWC-based initialization.
swc_init = false


# ── Gaussian model ─────────────────────────────────────────────────────────────

[model]

n_init = 10000
max_gaussians = 10000

# Initial standard deviation in voxel units.
initial_scale = 2.0
initial_confidence = 1.0

# Ignore contributions beyond this Mahalanobis radius.
cutoff_sigma = 4.0

# Denominator stability term.
epsilon = 1e-8

# Restrict trainable intensity features to the normalized data range.
constrain_features = true
feature_min = 0.0
feature_max = 1.0

minimum_scale = 1e-3
minimum_confidence = 1e-6

# Hard architectural scale limit, not a loss regularizer.
scale_max_hard = 0.15


# ── Initialization ─────────────────────────────────────────────────────────────

[initialization]

# Options: intensity_weighted, uniform, grid, top_intensity.
strategy = "intensity_weighted"

# Mix uniform samples with intensity-weighted samples.
uniform_sample_fraction = 0.3
intensity_power = 1.0
minimum_sampling_weight = 1e-6

# Random displacement in voxel units.
jitter = 0.25

# Options: nearest, trilinear.
feature_sampling = "trilinear"
sample_features_from_target = true

# Initialize rotations as identity quaternions.
identity_rotation = true


# ── Training ───────────────────────────────────────────────────────────────────

[training]

epochs = 500
steps_per_epoch = 50

# Must normally equal epochs * steps_per_epoch.
iterations = 25000

# Reconstruct the complete volume at every optimization step.
batch_mode = "full_volume"

clamp_means = true
mean_clamp_margin = 0.0


# ── Optimizer ──────────────────────────────────────────────────────────────────

[optimizer]

name = "adam"

mean_lr = 1e-3
scale_lr = 1e-3
rotation_lr = 5e-4
confidence_lr = 1e-3
feature_lr = 1e-2

weight_decay = 0.0

beta1 = 0.9
beta2 = 0.999
epsilon = 1e-8


# ── Learning-rate schedule ─────────────────────────────────────────────────────

[scheduler]

enabled = false
name = "cosine"

minimum_lr_ratio = 0.05
warmup_steps = 0


# ── Reconstruction loss ────────────────────────────────────────────────────────

[loss]

# total = l1_weight * L1 + ssim_weight * (1 - SSIM)
l1_weight = 0.7
ssim_weight = 0.3

data_range = 1.0
ssim_window_size = 11
ssim_sigma = 1.5

gradient_weight = 0.0


# ── Disabled regularizers ──────────────────────────────────────────────────────

[regularization]

scale = 0.0
scale_ceiling = 0.0
scale_outlier = 0.0
sparsity = 0.0
anisotropy = 0.0
count = 0.0
intensity_l1 = 0.0
coverage = 0.0
overlap = 0.0
gradient = 0.0


# ── Densification ──────────────────────────────────────────────────────────────

[densification]

enabled = true

from_step = 500
until_step = 20000

# Evaluated twice as often as the original 100 (see max_new_gaussians below
# for why this is safe), so the population can compound faster.
interval = 50

# Base threshold for the mean-gradient magnitude. 2e-4 (copied from
# 3dgs.yml, tuned for the unnormalized GaussianCloud model in _3dgs.py) was
# above the max mean-gradient norm ever observed here (measured ~1.5e-4 at
# n_init=1000 on processed_data/complex_...) -- this model's normalized
# V(x) = sum(w_i f_i)/sum(w_i) reconstruction divides gradients down by the
# per-voxel weight total, so mean-gradients run smaller than in the
# unnormalized model that threshold was tuned for. Densification never
# fired as a result, and pruning alone shrank the population while scale
# and confidence inflated to compensate -- PSNR peaked early then degraded.
# Empirically measured selection fraction at n_init=1000 by threshold:
#   1e-4 -> 1.9%   8e-5 -> 4.7%   6e-5 -> 10.0%   5e-5 -> 15.3%
#   4e-5 -> 25.0%  3e-5 -> 40.6%  2.5e-5 -> 49.3%
# 3e-5 selects ~40% per event -- more aggressive than the initial 5e-5 fix
# (~15%), while staying well above the ~1e-6 noise floor.
gradient_threshold = 3e-5

# Increase the threshold as the Gaussian population grows:
#
# effective_threshold =
#     gradient_threshold
#     * (current_count / initial_count) ^ population_exponent
#
# Lowered from 0.8: a smaller exponent brakes more slowly as N grows, so
# growth keeps compounding for longer before self-limiting.
population_exponent = 0.5

# Clone smaller Gaussians and split larger Gaussians.
clone_scale_threshold = 2.0
split_scale_threshold = 2.0

# Raised from 1000 to accommodate the larger candidate pools that the lower
# gradient_threshold and shorter interval now produce each event.
max_new_gaussians = 2000
max_gaussians = 50000

clone_jitter_fraction = 0.25
clone_confidence_fraction = 0.5

split_children = 2
split_offset_fraction = 0.5
split_scale_factor = 0.7

minimum_confidence = 1e-4


# ── Pruning ────────────────────────────────────────────────────────────────────

[pruning]

enabled = true

from_step = 500
until_step = 20000
interval = 100

minimum_confidence = 0.01
minimum_feature = 0.0
minimum_scale = 1e-3

# Optional oversized-Gaussian threshold.
# maximum_scale = 999.0

remove_outside_volume = true
outside_margin = 0.0

# Preserve at least this many Gaussians.
minimum_gaussians = 64

# Ranking weights used when too many Gaussians qualify for pruning.
confidence_score_weight = 1.0
feature_score_weight = 1.0


# ── Logging and checkpoints ────────────────────────────────────────────────────

[logging]

log_dir = "logs"

log_every = 500
checkpoint_every = 500

compute_psnr = true
compute_ssim = true

# Avoid computing expensive full-volume metrics every iteration.
metrics_every = 100


# ── Output ─────────────────────────────────────────────────────────────────────

[output]

# The CLI --output argument should normally override this directory.
checkpoint = "outputs/"

reconstruction = "outputs/fafb_v18/b_211/reconstruction.tif"
history = "outputs/fafb_v18/b_211/history.json"

# Keep the saved reconstruction in normalized [0,1] form.
denormalize_reconstruction = false

save_intermediate_volumes = false